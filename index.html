<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juancho Hernandez - Portafolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sección de Portada clicable -->
    <a href="#obras" class="hero">
        <div class="hero-content">
            <h1>JUANCHO HERNANDEZ</h1>
        </div>
    </a>

    <!-- Sección de Obras (Conserva tu diseño manual asimétrico y superpuesto original) -->
    <section style="max-height: 2452px; height: 1915px;" id="obras" class="obras-section">
        <header class="obras-header">
            <h2>JUANCHO HERNANDEZ</h2>
            <nav class="nav-links">
                <a href="bitacora.html">Bitácora</a>
                <a href="bio.html">Bio</a>
                <a href="#modelos-3d">3D</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </header>

        <!-- Collage manual de obras principales -->
        <div class="obras-collage">
             <article class="obra-item">
                <img src="img/obras/aurafarming/block3-flux-2.JPG" alt="Aura Farming for Personal Development">
                <div class="obra-overlay">
                    <h3>Aura Farming for Personal Development</h3>
                </div>
            </article>
            
             <article class="obra-item">
                <img src="img/obras/flux/_7028294.jpg" alt="Flux Topology">
                <div style="width: 100%; flex-direction: row; position: absolute; display: flex;" class="obra-overlay">
                    <h3>Flux Topology</h3>
                </div>
            </article>

            <article class="obra-item">
                <img src="img/obras/lvpnp/1.jpg" alt="La verdad, preferiría no pensar">
                <div class="obra-overlay">
                    <h3>La verdad, preferiría no pensar</h3>
                </div>
            </article>

            <article class="obra-item">
                <img src="img/obras/lvpns/1.jpg" alt="La verdad, preferiría no sentir">
                <div class="obra-overlay">
                    <h3>La verdad, preferiría no sentir</h3>
                </div>
            </article>

            <article class="obra-item">
                <img src="img/obras/lvpnq/1.jpg" alt="La verdad, preferiría no querer">
                <div class="obra-overlay">
                    <h3>La verdad, preferiría no querer</h3>
                </div>
            </article>
            
             <article class="obra-item">
                <img src="img/obras/lpp2/1.jpg" alt="Like para parte 2">
                <div class="obra-overlay">
                    <h3>Like para parte 2</h3>
                </div>
            </article>
            
              <article class="obra-item">
                <img src="img/obras/careculos/_DSC0224.jpg" alt="El libro de los careculos">
                <div style="flex-direction: row;" class="obra-overlay">
                    <h3>El libro de los careculos</h3>
                </div>
            </article>
            
              <article class="obra-item">
                <img src="img/obras/karaoke/3.jpg" alt="Karaoke viral">
                <div class="obra-overlay">
                    <h3>Karaoke viral</h3>
                </div>
            </article>
            
              <article class="obra-item">
                <img src="img/obras/elputojuego/2.jpg" alt="El puto juego">
                <div class="obra-overlay">
                    <h3>El puto juego</h3>
                </div>
            </article>
        </div>
    </section>
    
    <!-- Sección de Modelos 3D (Usa el nuevo diseño denso y automático para tus 22 imágenes) -->
    <section id="modelos-3d" class="obras-section">
        <header class="obras-header">
            <h2>3D</h2>
        </header>

        <!-- Contenedor con la clase específica para el collage 3D -->
        <div class="collage-3d" id="contenedor-3d"></div>
    </section>

    <!-- Script automatizado para inyectar las 22 imágenes en la sección 3D -->
    <script>
        const totalModelos3D = 26; // Cambia este número si en el futuro necesitas más
        const contenedor3D = document.getElementById('contenedor-3d');

        for (let i = 1; i <= totalModelos3D; i++) {
            const article = document.createElement('article');
            article.className = 'obra-item-3d';
            
            article.innerHTML = `
                <img src="img/3d/${i}.webp" alt="Modelo 3D ${i}">
                <div class="obra-overlay">
                    <h3></h3>
                </div>
            `;
            
            contenedor3D.appendChild(article);
        }
    </script>

</body>
</html>
