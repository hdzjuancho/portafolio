backend:
  name: github
  repo: hdzjuancho/portafolio  # <- Reemplaza con tu usuario y nombre de repositorio en GitHub
  branch: main

# Carpeta donde se guardarán las imágenes subidas desde el panel
media_folder: "img/bitacora"
public_folder: "img/bitacora"

collections:
  - name: "bitacora"
    label: "Bitácora"
    folder: "content/bitacora"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime"}
      - {label: "Contenido / Párrafos", name: "body", widget: "markdown"}
      - {label: "Imagen Principal / Multimedia", name: "image", widget: "image", required: false}
      - {label: "PDF Adjunto", name: "pdf", widget: "file", required: false}